[project]
name = "geovision-ai"
version = "0.1.0"
description = "Intelligent Satellite Imagery Analysis Platform"
readme = "README.md"
requires-python = "==3.12"

dependencies = [
    "streamlit>=1.32.0",
    "planet>=2.5.0",
    "openai-agents>=0.6.4",
    "rasterio>=1.3.9",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "geojson>=3.1.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
]
